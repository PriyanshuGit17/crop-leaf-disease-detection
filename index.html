<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaf Disease Detector</title>
<style>
    body { font-family:Poppins;background:#2e7d32;height:100vh;display:flex;justify-content:center;align-items:center;color:white;}
    .box{width:450px;background:rgba(255,255,255,0.2);padding:20px;border-radius:15px;text-align:center;}
    #preview{width:250px;height:250px;border-radius:10px;border:2px dashed white;margin-top:10px;object-fit:cover;}
    button{padding:12px 20px;border:0;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer;}
    .upload{background:white;color:#1b5e20;}
    .predict{background:#00e676;color:#003d00;}
    .bar-box{width:100%;height:15px;background:#fff3;border-radius:10px;margin-top:10px;}
    .bar{height:100%;width:0%;background:#00ff00;border-radius:10px;transition:0.8s;}
</style>
</head>

<body>
<div class="box">
<h2>🌱 Leaf Disease Detection</h2>

<input type="file" id="imageInput" accept="image/*" hidden>
<button class="upload" onclick="document.getElementById('imageInput').click()">Upload Image</button>

<img id="preview">

<button class="predict" onclick="uploadImage()">Predict</button>

<div id="result-box" style="display:none;">
    <h3>📊 Result</h3>
    <p id="disease"></p>
    <p id="prob"></p>
    <p id="level"></p>
    <p id="suggest"></p>
    <p id="adv"></p>

    <h3>💚 Healing Score</h3>
    <div class="bar-box"><div id="bar" class="bar"></div></div>

    <h3>Top Predictions</h3>
    <p id="top3"></p>
</div>
</div>

<script>
document.getElementById("imageInput").onchange = e => {
    document.getElementById("preview").src = URL.createObjectURL(e.target.files[0]);
};

async function uploadImage() {
    let file = document.getElementById("imageInput").files[0];
    if (!file) return alert("Upload an image!");

    let fd = new FormData();
    fd.append("file", file);

    let r = await fetch("http://127.0.0.1:5000/predict", { method:"POST", body:fd });
    let data = await r.json();

    document.getElementById("result-box").style.display = "block";
    document.getElementById("disease").innerHTML = "<b>Disease:</b> " + data.top_class;
    document.getElementById("prob").innerHTML = "<b>Probability:</b> " + data.probability;
    document.getElementById("level").innerHTML = "<b>Infection Level:</b> " + data.infection_level;
    document.getElementById("suggest").innerHTML = "<b>Treatment:</b> " + data.suggestion;
    document.getElementById("adv").innerHTML = "<b>Advice:</b> " + data.advice;

    document.getElementById("bar").style.width = data.healing_score + "%";

    let txt = "";
    data.all_results.slice(0,3).forEach(r => txt += `${r[0]} — ${r[1]}%<br>`);
    document.getElementById("top3").innerHTML = txt;
}
</script>

</body>
</html>
